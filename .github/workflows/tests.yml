# Pruebas por era, en trabajos separados (uno que falle no tapa a los demás: no hay matriz, así que
# «fail-fast: false» no hace falta; cada trabajo corre hasta el final aunque otro falle).
# push solo en main + pull_request en el resto de las ramas: así un mismo SHA no corre dos veces (push y PR).
# Las suites largas de balance NO están acá: ver balance.yml (manual).
name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # bash -e -o pipefail: un fallo dentro de «| tee» también corta el paso

jobs:
  era1:
    name: Era 1 (determinismo, acciones, sonido, online, relay)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: cd server && npm install
      - name: npm test
        run: mkdir -p ci-logs && npm test 2>&1 | tee ci-logs/era1.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fallo-era1
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  era2:
    name: Era 2 (guardado, UI, arte, audio, calidad-sim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # la prueba de guardado viejo lee el HTML del commit base 1bd2b9d
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guardado y determinismo
        run: mkdir -p ci-logs ci-shots && node tests/era2-guardado.js 2>&1 | tee ci-logs/era2-guardado.log
      - name: Interfaz (escritorio, móvil, tutorial)
        if: ${{ !cancelled() }}
        run: SHOTS=ci-shots node tests/era2-ui.js 2>&1 | tee ci-logs/era2-ui.log
      - name: "Arte (sin medir fps, el runner es lento y comparte CPU)"
        if: ${{ !cancelled() }}
        run: node tests/era2-arte.js --sinfps 2>&1 | tee ci-logs/era2-arte.log
      - name: Audio (mediciones con OfflineAudioContext)
        if: ${{ !cancelled() }}
        run: node tests/era2-audio.js 2>&1 | tee ci-logs/era2-audio.log
      - name: Calidad de simulación (rápida)
        if: ${{ !cancelled() }}
        env:
          CI_NO_FPS: "1"   # el runner comparte CPU: se mide fps en local, no en CI
        run: node tests/era2-calidad-sim.js 2>&1 | tee ci-logs/era2-calidad-sim.log
      - name: Órdenes y frases de causa
        if: ${{ !cancelled() }}
        run: node tests/era2-ordenes.js 2>&1 | tee ci-logs/era2-ordenes.log
      - name: Evolución con capacidades y acuáticos a tierra
        if: ${{ !cancelled() }}
        run: node tests/era2-evolucion.js 2>&1 | tee ci-logs/era2-evolucion.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fallo-era2
          path: |
            ci-logs
            ci-shots
            docs/artgate/screens
          if-no-files-found: ignore
          retention-days: 14

  era3:
    name: Era 3 (guardado, bot, ciclo, UI, arte)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guardado y determinismo
        run: mkdir -p ci-logs ci-shots && node tests/era3-guardado.js 2>&1 | tee ci-logs/era3-guardado.log
      - name: Bot de 10 minutos (escritorio y móvil)
        if: ${{ !cancelled() }}
        run: node tests/era3-bot.js ci-shots/era3-escritorio.png ci-shots/era3-movil.png 2>&1 | tee ci-logs/era3-bot.log
      - name: Ciclo económico completo y rivales
        if: ${{ !cancelled() }}
        run: node tests/era3-ciclo.js 2>&1 | tee ci-logs/era3-ciclo.log
      - name: Interfaz estratégica (HUD, alertas, móvil, tutorial)
        if: ${{ !cancelled() }}
        run: node tests/era3-ui.js 2>&1 | tee ci-logs/era3-ui.log
      - name: Arte y animaciones
        if: ${{ !cancelled() }}
        run: node tests/era3-arte.js 2>&1 | tee ci-logs/era3-arte.log
      - name: Civilizaciones, Edades y linaje
        if: ${{ !cancelled() }}
        run: node tests/era3-civs.js 2>&1 | tee ci-logs/era3-civs.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fallo-era3
          path: |
            ci-logs
            ci-shots
          if-no-files-found: ignore
          retention-days: 14

  era4:
    name: Era 4 (guardado, bot de 5 min)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Guardado, determinismo y linaje
        run: mkdir -p ci-logs ci-shots && node tests/era4-guardado.js 2>&1 | tee ci-logs/era4-guardado.log
      - name: Continuidad por civilización, fin de partida y arte
        if: ${{ !cancelled() }}
        run: node tests/era4-continuidad.js 2>&1 | tee ci-logs/era4-continuidad.log
      - name: Bot de 5 minutos (escritorio y móvil)
        run: node tests/era4-bot.js ci-shots/era4-escritorio.png ci-shots/era4-movil.png 2>&1 | tee ci-logs/era4-bot.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fallo-era4
          path: |
            ci-logs
            ci-shots
          if-no-files-found: ignore
          retention-days: 14

  audio-eras34:
    name: Audio Eras 3 y 4 (mediciones offline, cableado, controles, escucha.html)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Audio Era 3 (ánimos, ambientes, efectos, transiciones, ducking, fugas, determinismo, controles)
        run: mkdir -p ci-logs && node tests/era3-audio.js 2>&1 | tee ci-logs/era3-audio.log
      - name: Audio Era 4 (cableado y controles)
        if: ${{ !cancelled() }}
        run: node tests/era4-audio.js 2>&1 | tee ci-logs/era4-audio.log
      - name: Página de escucha humana
        if: ${{ !cancelled() }}
        run: node tests/escucha.js 2>&1 | tee ci-logs/escucha.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fallo-audio-eras34
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14

  era56:
    name: Eras 5 y 6 (determinismo, guardado, linaje, interfaz, en línea con reconexión)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: cd server && npm install
      - name: Eras 5 y 6
        run: mkdir -p ci-logs && node tests/era56.js 2>&1 | tee ci-logs/era56.log
      - name: En línea (relay + 3 navegadores, desconexión y reconexión)
        if: ${{ !cancelled() }}
        run: node tests/online56.js 2>&1 | tee ci-logs/online56.log
      - name: Balance corto (Normal, 4 partidas por era)
        if: ${{ !cancelled() }}
        run: node tests/era5-balance.js 1 4 2>&1 | tee ci-logs/era5-balance.log && node tests/era6-balance.js 1 4 2>&1 | tee ci-logs/era6-balance.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fallo-era56
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 14
