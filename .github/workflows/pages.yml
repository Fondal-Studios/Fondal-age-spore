# Publica el juego (portada, apoyo, PWA, eras/ y art/) en GitHub Pages en cada push a main, para jugar desde el celular.
# Requisito único: en Settings → Pages, «Source» = «GitHub Actions».
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio (solo lo que usa el juego)
        run: |
          mkdir -p _site
          cp index.html apoyar.html manifest.webmanifest sw.js MULTIJUGADOR.md _site/
          cp -r eras art _site/
          rm -rf _site/art/runway/raw _site/art/runway/era3/_raw _site/art/runway/era3/_ref
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
